name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The SDK binary and the app need Xcode 27.1; the macos-26 images stop at Xcode 26.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      # The app needs the EON client credentials at runtime, so CI writes the
      # untracked Secrets.swift from repository secrets before building.
      - name: Write Secrets.swift
        env:
          EON_ANDROIDTV_CLIENT_ID: ${{ secrets.EON_ANDROIDTV_CLIENT_ID }}
          EON_ANDROIDTV_CLIENT_SECRET: ${{ secrets.EON_ANDROIDTV_CLIENT_SECRET }}
          EON_WEB_CLIENT_ID: ${{ secrets.EON_WEB_CLIENT_ID }}
          EON_WEB_CLIENT_SECRET: ${{ secrets.EON_WEB_CLIENT_SECRET }}
          EON_SMARTTV_CLIENT_ID: ${{ secrets.EON_SMARTTV_CLIENT_ID }}
          EON_SMARTTV_CLIENT_SECRET: ${{ secrets.EON_SMARTTV_CLIENT_SECRET }}
        run: |
          cat > EON_TV/App/Secrets.swift <<EOF
          enum Secrets {
            static let androidTVClientID = "${EON_ANDROIDTV_CLIENT_ID}"
            static let androidTVClientSecret = "${EON_ANDROIDTV_CLIENT_SECRET}"
            static let webClientID = "${EON_WEB_CLIENT_ID}"
            static let webClientSecret = "${EON_WEB_CLIENT_SECRET}"
            static let smartTVClientID = "${EON_SMARTTV_CLIENT_ID}"
            static let smartTVClientSecret = "${EON_SMARTTV_CLIENT_SECRET}"
          }
          EOF

      # pipefail so a failing xcodebuild fails the step instead of the formatter's exit code winning.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project EON_TV.xcodeproj \
            -scheme EON_TV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
